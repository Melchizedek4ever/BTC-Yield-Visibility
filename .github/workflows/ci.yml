# Every PR must pass lint, typecheck, the full test suite, and a production
# build before merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Lint, types and tests all pass on a tree that does not compile. The
      # build is the only step that proves the app can actually ship.
      - run: npm run build
